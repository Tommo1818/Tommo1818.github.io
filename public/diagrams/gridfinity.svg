<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="gf-title">
  <title id="gf-title">A drawer is tiled into Gridfinity baseplates, which are packed onto printer plates and exported as 3MF or STL</title>
  <defs>
    <marker id="gf-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a5a72"/>
    </marker>
    <linearGradient id="gf-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".26"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity=".10"/>
    </linearGradient>
  </defs>

  <text x="40" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1.6" fill="#5a5a72">INPUT → OUTPUT</text>

  <!-- Drawer -->
  <rect x="40" y="60" width="220" height="200" rx="14" fill="#0f0f16" stroke="#2a2a3a"/>
  <rect x="52" y="72" width="196" height="176" rx="8" fill="none" stroke="#26263a" stroke-dasharray="5 5"/>

  <rect x="60" y="74" width="80" height="80" rx="6" fill="#171722" stroke="#3a3a52"/>
  <rect x="148" y="74" width="80" height="80" rx="6" fill="url(#gf-accent)" stroke="#a78bfa"/>
  <rect x="60" y="162" width="80" height="80" rx="6" fill="#171722" stroke="#3a3a52"/>
  <rect x="148" y="162" width="80" height="80" rx="6" fill="#171722" stroke="#3a3a52"/>

  <text x="150" y="288" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#e8e8f0">480 × 410 mm</text>
  <text x="150" y="308" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#7a7a8c">mm / cm / in · IKEA presets</text>

  <!-- Arrow -->
  <line x1="278" y1="160" x2="344" y2="160" stroke="#4a4a5e" stroke-width="1.5" marker-end="url(#gf-arrow)"/>
  <text x="311" y="147" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#8f8fa4">balanced tiling</text>

  <!-- Printer bed -->
  <rect x="355" y="60" width="250" height="200" rx="14" fill="#0d0d13" stroke="#3a3a4e" stroke-dasharray="6 5"/>
  <text x="480" y="84" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#6f6f80">Bambu A1 mini · 180 mm bed</text>

  <rect x="371" y="98" width="108" height="60" rx="5" fill="#171722" stroke="#3a3a52"/>
  <rect x="489" y="98" width="108" height="60" rx="5" fill="#171722" stroke="#3a3a52"/>
  <rect x="371" y="168" width="226" height="60" rx="5" fill="#171722" stroke="#7dd3fc" stroke-opacity=".7"/>

  <!-- Output chips -->
  <rect x="40" y="322" width="252" height="30" rx="8" fill="#12121a" stroke="#26263a"/>
  <text x="52" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#b9b9c9">Bambu .3MF · every copy pre-placed</text>

  <rect x="304" y="322" width="301" height="30" rx="8" fill="#12121a" stroke="#26263a"/>
  <text x="316" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#b9b9c9">STL / ZIP · assembly guide included</text>
</svg>
